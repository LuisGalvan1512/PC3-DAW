<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Asignaciones - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">🍽️ Sabor Gourmet</a>
        <div class="d-flex">
            <span class="navbar-text me-3" sec:authentication="name">Usuario</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    <h4><i class="fas fa-history"></i> Historial Completo de Asignaciones</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <a href="/asignaciones" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i> Volver a Activas
                        </a>
                        <a href="/dashboard" class="btn btn-secondary">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </div>

                    <!-- Tabla de historial -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover table-sm">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Mesa</th>
                                <th>Tipo</th>
                                <th>Fecha Asignación</th>
                                <th>Fecha Liberación</th>
                                <th>Duración</th>
                                <th>Estado</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="asignacion : ${asignaciones}">
                                <td th:text="${asignacion.idAsignacion}"></td>
                                <td th:text="${asignacion.cliente.nombres + ' ' + asignacion.cliente.apellidos}"></td>
                                <td th:text="'Mesa ' + ${asignacion.mesa.numero}"></td>
                                <td>
                                            <span th:if="${asignacion.tipo.name() == 'OCUPACION'}"
                                                  class="badge bg-danger">OCUPACIÓN</span>
                                    <span th:if="${asignacion.tipo.name() == 'RESERVA'}"
                                          class="badge bg-warning">RESERVA</span>
                                </td>
                                <td th:text="${#temporals.format(asignacion.fechaAsignacion, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                            <span th:if="${asignacion.fechaLiberacion != null}"
                                                  th:text="${#temporals.format(asignacion.fechaLiberacion, 'dd/MM/yyyy HH:mm')}"></span>
                                    <span th:unless="${asignacion.fechaLiberacion != null}">-</span>
                                </td>
                                <td>
                                            <span th:if="${asignacion.fechaLiberacion != null}">
                                                <!-- Aquí podrías calcular la duración -->
                                                <small class="text-muted">Calculado</small>
                                            </span>
                                    <span th:unless="${asignacion.fechaLiberacion != null}">
                                                <span class="badge bg-info">En curso</span>
                                            </span>
                                </td>
                                <td>
                                    <span th:if="${asignacion.activa}" class="badge bg-success">ACTIVA</span>
                                    <span th:unless="${asignacion.activa}" class="badge bg-secondary">FINALIZADA</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
