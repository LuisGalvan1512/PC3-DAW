<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Cliente - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 th:text="${cliente.idCliente == null ? 'Nuevo Cliente' : 'Editar Cliente'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                        <input type="hidden" th:field="*{idCliente}">

                        <div class="mb-3">
                            <label for="dni" class="form-label">DNI *</label>
                            <input type="text" class="form-control" id="dni" th:field="*{dni}"
                                   required maxlength="8" pattern="[0-9]{8}">
                            <div class="text-danger" th:if="${#fields.hasErrors('dni')}"
                                 th:errors="*{dni}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="nombres" class="form-label">Nombres *</label>
                            <input type="text" class="form-control" id="nombres" th:field="*{nombres}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('nombres')}"
                                 th:errors="*{nombres}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="apellidos" class="form-label">Apellidos *</label>
                            <input type="text" class="form-control" id="apellidos" th:field="*{apellidos}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('apellidos')}"
                                 th:errors="*{apellidos}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="correo" th:field="*{correo}">
                            <div class="text-danger" th:if="${#fields.hasErrors('correo')}"
                                 th:errors="*{correo}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a href="/clientes" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
