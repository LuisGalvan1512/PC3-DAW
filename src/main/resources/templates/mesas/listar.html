<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mesas - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .badge-mesa {
            font-size: 1rem;
            padding: 0.5rem 1rem;
        }
        .card-mesa {
            transition: transform 0.2s;
        }
        .card-mesa:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">🍽️ Sabor Gourmet</a>
        <div class="d-flex">
            <span class="navbar-text me-3" sec:authentication="name">Usuario</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Estadísticas -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title"><i class="fas fa-check-circle"></i> Mesas Disponibles</h5>
                    <h2 th:text="${disponibles}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-white bg-danger">
                <div class="card-body">
                    <h5 class="card-title"><i class="fas fa-users"></i> Mesas Ocupadas</h5>
                    <h2 th:text="${ocupadas}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Gestión de Mesas -->
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4><i class="fas fa-table"></i> Gestión de Mesas</h4>
                </div>
                <div class="card-body">
                    <!-- Mensajes -->
                    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Botones de acción -->
                    <div class="mb-3">
                        <a href="/mesas/nuevo" class="btn btn-success">
                            <i class="fas fa-plus"></i> Nueva Mesa
                        </a>
                        <a href="/dashboard" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Volver al Dashboard
                        </a>
                    </div>

                    <!-- Tabla de mesas -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Número</th>
                                <th>Capacidad</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="mesa : ${mesas}">
                                <td th:text="${mesa.idMesa}"></td>
                                <td><strong th:text="'Mesa ' + ${mesa.numero}"></strong></td>
                                <td>
                                    <i class="fas fa-users"></i>
                                    <span th:text="${mesa.capacidad} + ' personas'"></span>
                                </td>
                                <td>
                                            <span th:if="${mesa.estado.name() == 'DISPONIBLE'}"
                                                  class="badge bg-success badge-mesa">DISPONIBLE</span>
                                    <span th:if="${mesa.estado.name() == 'OCUPADA'}"
                                          class="badge bg-danger badge-mesa">OCUPADA</span>
                                    <span th:if="${mesa.estado.name() == 'RESERVADA'}"
                                          class="badge bg-warning badge-mesa">RESERVADA</span>
                                    <span th:if="${mesa.estado.name() == 'MANTENIMIENTO'}"
                                          class="badge bg-secondary badge-mesa">MANTENIMIENTO</span>
                                </td>
                                <td>
                                    <!-- Botones de cambio de estado -->
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/mesas/cambiar-estado/{id}/DISPONIBLE(id=${mesa.idMesa})}"
                                           class="btn btn-success" title="Disponible">
                                            <i class="fas fa-check"></i>
                                        </a>
                                        <a th:href="@{/mesas/cambiar-estado/{id}/OCUPADA(id=${mesa.idMesa})}"
                                           class="btn btn-danger" title="Ocupar">
                                            <i class="fas fa-users"></i>
                                        </a>
                                        <a th:href="@{/mesas/cambiar-estado/{id}/RESERVADA(id=${mesa.idMesa})}"
                                           class="btn btn-warning" title="Reservar">
                                            <i class="fas fa-bookmark"></i>
                                        </a>
                                    </div>

                                    <!-- Botones de editar y eliminar -->
                                    <a th:href="@{/mesas/editar/{id}(id=${mesa.idMesa})}"
                                       class="btn btn-info btn-sm ms-2">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/mesas/eliminar/{id}(id=${mesa.idMesa})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('¿Está seguro de eliminar esta mesa?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
