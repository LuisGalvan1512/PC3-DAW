<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Mesa - Sabor Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 th:text="${mesa.idMesa == null ? 'Nueva Mesa' : 'Editar Mesa'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/mesas/guardar}" th:object="${mesa}" method="post">
                        <input type="hidden" th:field="*{idMesa}">

                        <div class="mb-3">
                            <label for="numero" class="form-label">Número de Mesa *</label>
                            <input type="number" class="form-control" id="numero" th:field="*{numero}"
                                   required min="1">
                            <div class="text-danger" th:if="${#fields.hasErrors('numero')}"
                                 th:errors="*{numero}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="capacidad" class="form-label">Capacidad (personas) *</label>
                            <input type="number" class="form-control" id="capacidad" th:field="*{capacidad}"
                                   required min="1" max="20">
                            <div class="text-danger" th:if="${#fields.hasErrors('capacidad')}"
                                 th:errors="*{capacidad}"></div>
                        </div>

                        <div class="mb-3" th:if="${mesa.idMesa != null}">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" th:field="*{estado}">
                                <option th:each="estado : ${estados}"
                                        th:value="${estado}"
                                        th:text="${estado}"></option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a href="/mesas" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
